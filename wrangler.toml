# Cloudflare Pages configuration (source of truth for bindings on Git deployments).
name = "chembrain"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
META_BASE_URL = "https://api.meta.ai/v1"
META_MODEL = "muse-spark-1.3"
META_REASONING_EFFORT = "medium"
META_JOB_TOKEN_BUDGET = "1500000"
META_DAILY_TOKEN_BUDGET = "3000000"
ALLOW_SIGNUP = "true"
RETAIN_ORIGINALS = "false"

[[d1_databases]]
binding = "DB"
database_name = "chembrain"
database_id = "a70ed53c-11d5-46c6-870b-80e810263fd5"
migrations_dir = "migrations"

# Preview deployments (non-main branches) use a separate database so untested code never touches
# production data. Non-inheritable keys must be repeated in full here.
[env.preview.vars]
META_BASE_URL = "https://api.meta.ai/v1"
META_MODEL = "muse-spark-1.3"
META_REASONING_EFFORT = "medium"
META_JOB_TOKEN_BUDGET = "300000"
META_DAILY_TOKEN_BUDGET = "600000"
ALLOW_SIGNUP = "true"
RETAIN_ORIGINALS = "false"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "chembrain-preview"
database_id = "dec07278-a016-4823-be74-6f8cc8e2945e"
migrations_dir = "migrations"
